on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show system information
        run: |
          echo "Runner: $RUNNER_NAME"
          uname -a

      - name: Build
        run: |
          echo "Build successful"

      - name: Test
        run: |
          echo "Test successful"


